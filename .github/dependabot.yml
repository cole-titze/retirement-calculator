# Weekly dependency PRs: one PR per ecosystem for minor/patch updates (merged
# automatically by dependabot-merge.yml once CI passes) and one for majors (the
# "-majors" groups, handled by the k8s-major-upgrade skill). Node majors are
# upgraded on purpose.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
      npm-majors:
        update-types: [major]
    ignore:
      # ESLint 10 waits for eslint-plugin-react to support it
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # TypeScript majors wait for typescript-eslint to support them (it allows <6.1)
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
