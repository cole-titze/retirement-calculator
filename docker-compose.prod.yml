# Not closely maintained; may lag behind production. Production is deployed by
# https://github.com/cole-titze/ansible-setup (raspberry-pi-playbooks/cluster/kubernetes/retirement-calculator/)
name: retirement-calculator

services:
  frontend:
    image: ghcr.io/cole-titze/retirement-calculator:latest
    restart: always
    ports:
      - "8082:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    profiles: ["tunnel"]
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
